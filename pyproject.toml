[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rheogp"
version = "1.1.0"
description = "Physics-informed sparse Gaussian processes for fractional rheology and chirp rheometry"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Isaac Miranda-Valdez", email = "isaac@deltanlabs.com" },
]
keywords = ["rheology", "gaussian-process", "fractional-calculus",
            "viscoelasticity", "chirp", "OWCh"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.23",
  "scipy>=1.10",
  "torch>=2.0",
  "gpytorch>=1.11",
  "scikit-learn>=1.2",
  "matplotlib>=3.6",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]
# Only `demos/mastercurve_compare.py` needs these, and only its compute
# half: the cross-check of a rheogp master curve against the one the
# `mastercurves` package builds from the same spectra, with `pyRheo`
# fitting each. The plotting half is numpy/json only.
compare = ["mastercurves", "pyRheo"]

[tool.setuptools.packages.find]
include = ["rheogp*"]
